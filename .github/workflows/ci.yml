name: AegisOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile app/api/main.py
          python -m py_compile app/agent/remediation.py
          python -m py_compile app/agent/server.py
          python -m py_compile app/dashboard/main.py
          python -m py_compile app/dashboard/simulator.py

      - name: Run tests
        run: |
          python -m pytest -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AegisOps API image
        run: |
          docker build -t aegisops-api:ci .