apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegisops-api
  namespace: aegisops

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegisops-api

  minReplicas: 2
  maxReplicas: 4

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50